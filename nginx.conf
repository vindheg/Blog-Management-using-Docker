server {
    listen 80;

    # --- CRITICAL FIX: Add this resolver line ---
    resolver 10.96.0.1 valid=5s; 
    # ---------------------------------------------

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location ~ /(InsertBlog|DeleteComment|latestBlogs|metrics) {
        
        # --- CRITICAL FIX: Change to full DNS name (backend-service assumed) ---
        # The 'backend' Service name is likely 'backend-service' from your initial YAML
        proxy_pass http://backend:3000;
        # -----------------------------------------------------------------------
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}