services:
  # -------------------- 1. Database Service --------------------
  db:
    image: mysql:8.0
    container_name: blog_db_final
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: blog
    ports:
      - "3307:3306"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5
      start_period: 20s
    networks: # <-- ADD THIS
      - app-network # <-- ADD THIS

  # -------------------- 2. Backend Service (Node.js/Express) --------------------
  backend:
    build: ./backend
    container_name: blog_backend_final
    restart: always
    ports: # <-- UNCOMMENT/ADD THIS
      - "3000:3000" # <-- UNCOMMENT/ADD THIS
    depends_on:
      db:
        condition: service_healthy
    networks: # <-- ADD THIS
      - app-network # <-- ADD THIS

  # -------------------- 3. Frontend Service (Nginx) --------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: blog_frontend_2
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks: # <-- ADD THIS
      - app-network # <-- ADD THIS

  # -------------------- 4. Monitoring (Prometheus) --------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_final
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9091:9090"
    depends_on:
      - backend
    networks: # <-- ADD THIS
      - app-network # <-- ADD THIS

  # -------------------- 5. Monitoring (Grafana) --------------------
  grafana:
    image: grafana/grafana:latest
    container_name: grafana_final
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin_password
    depends_on:
      - prometheus
    networks: # <-- ADD THIS
      - app-network # <-- ADD THIS

# ==================== ADD THIS ENTIRE SECTION AT THE BOTTOM ====================
networks:
  app-network:
    driver: bridge